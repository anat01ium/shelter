<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Cozy Hose &bull; Pets page</title>

	<link rel="icon" href="assets/icons/dog-face.svg" type="image/svg+xml">
	<link rel="stylesheet" href="css/pets.css">
</head>

<body>
	<header class="header">
		<div class="container header__container">
			<div class="logo">
				<h1 class="logo__title">Cozy House</h1>
				<p class="logo__slogan">Shelter for pets in Boston</p>
			</div>

			<nav class="nav">
				<ul class="nav__list">
					<li class="nav__item"><a class="nav__link" href="index.html">About the shelter</a></li>
					<li class="nav__item"><a class="nav__link nav__link--active" href="pets.html">Our pets</a></li>
					<li class="nav__item"><a class="nav__link" href="#help">Help the shelter</a></li>
					<li class="nav__item"><a class="nav__link" href="#contacts">Contacts</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<footer class="footer section" id="contacts">
		<div class="container">
			<div class="footer__column">
				<h2 class="section__title">For questions and suggestions</h2>

				<ul class="contacts__list">
					<li class="contacts__item">
						<img class="contacts__icon" src="assets/icons/icon-email.svg" alt="Envelope">
						<a class="contacts__link" href="mailto:email@shelter.com">email@shelter.com</a>
					</li>

					<li class="contacts__item">
						<img class="contacts__icon" src="assets/icons/icon-phone.svg" alt="Phone">
						<a class="contacts__link" href="tel:+136745677554">+13 674 567 75 54</a>
					</li>
				</ul>
			</div>

			<div class="footer__column">
				<h2 class="section__title">We are waiting for your visit</h2>

				<ul class="contacts__list">
					<li class="contacts__item">
						<img class="contacts__icon" src="assets/icons/icon-marker.png" alt="Marker">
						<a class="contacts__link" href="https://maps.app.goo.gl/amMdFjsu1oYTs95K6" target="_blank">1 Central Street, Boston (entrance from the store)</a>
					</li>

					<li class="contacts__item">
						<img class="contact__icon" src="assets/icons/icon-marker.png" alt="Marker">
						<a class="contacts__link" href="https://maps.app.goo.gl/QRbNiAE42L1qrXa69" target="_blank">18 South Park, London </a>
					</li>
				</ul>
			</div>
			
			<img class="footer__img" src="assets/images/footer-puppy.png" alt="Puppy">
		</div>
	</footer>
</body>

</html>
